<div class="students-page">

  <div class="page-header">
    <div>
      <h1>Students</h1>
      <p>Manage all students in the school</p>
    </div>

    <button class="add-btn" (click)="showForm = true">
      + Add Student
    </button>
  </div>

  <div class="toolbar">

    <input
      type="text"
      placeholder="Search student..."
      [(ngModel)]="searchText"
    />

    <select [(ngModel)]="selectedClass">
      <option value="">All Classes</option>
      <option value="10A">10A</option>
      <option value="10B">10B</option>
      <option value="11A">11A</option>
    </select>

  </div>

  <div class="table-container">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Gender</th>
          <th>Class</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let student of filteredStudents">

          <td>{{ student.id }}</td>
          <td>{{ student.name }}</td>
          <td>{{ student.gender }}</td>
          <td>{{ student.class }}</td>
          <td>{{ student.phone }}</td>

          <td>
            <span class="status">
              {{ student.status }}
            </span>
          </td>

          <td class="actions">
            <button class="edit-btn">Edit</button>
            <button
              class="delete-btn"
              (click)="deleteStudent(student.id)"
            >
              Delete
            </button>
          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- Add Student Form -->

  <div class="modal" *ngIf="showForm">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Add New Student</h2>

        <button
          class="close-btn"
          (click)="showForm = false"
        >
          ×
        </button>
      </div>

      <input
        type="text"
        placeholder="Student name"
        [(ngModel)]="newStudent.name"
      />

      <select [(ngModel)]="newStudent.gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <select [(ngModel)]="newStudent.class">
        <option value="">Select Class</option>
        <option value="10A">10A</option>
        <option value="10B">10B</option>
        <option value="11A">11A</option>
      </select>

      <input
        type="text"
        placeholder="Phone number"
        [(ngModel)]="newStudent.phone"
      />

      <button
        class="save-btn"
        (click)="addStudent()"
      >
        Save Student
      </button>

    </div>

  </div>

</div>
